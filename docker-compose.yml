name: monitoring

services:
  db:
    image: mariadb:10
    container_name: librenms_db
    env_file:
      - ./env.env
    command:
      - mysqld
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  db-init:
    image: mariadb:10
    container_name: librenms_db_init
    env_file:
      - ./env.env
    depends_on:
      - db
    command: >
      sh -c "
      until mariadb -h db -uroot -p$${MARIADB_ROOT_PASSWORD} -e 'SELECT 1' >/dev/null 2>&1; do
        sleep 2;
      done;
      mariadb -h db -uroot -p$${MARIADB_ROOT_PASSWORD} -e
      \"CREATE DATABASE IF NOT EXISTS $${GRAFANA_DATABASE} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE USER IF NOT EXISTS '$${GRAFANA_USER}'@'%' IDENTIFIED BY '$${GRAFANA_PASSWORD}';
      GRANT ALL PRIVILEGES ON $${GRAFANA_DATABASE}.* TO '$${GRAFANA_USER}'@'%';
      FLUSH PRIVILEGES;\" 
      "
    restart: "no"

  redis:
    image: redis:7.2-alpine
    container_name: librenms_redis
    env_file:
      - ./env.env
    restart: unless-stopped

  msmtpd:
    image: crazymax/msmtpd:latest
    container_name: librenms_msmtpd
    env_file:
      - ./env.env
    restart: unless-stopped

  librenms:
    image: librenms/librenms:latest
    container_name: librenms
    hostname: librenms
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - ./env.env
    depends_on:
      - db
      - redis
      - msmtpd
    ports:
      - "8000:8000"
    volumes:
      - librenms_data:/data
    restart: unless-stopped

  dispatcher:
    image: librenms/librenms:latest
    container_name: librenms_dispatcher
    hostname: librenms-dispatcher
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - ./env.env
    depends_on:
      - librenms
      - redis
    environment:
      - SIDECAR_DISPATCHER=1
    volumes:
      - librenms_data:/data
    restart: unless-stopped

  syslogng:
    image: librenms/librenms:latest
    container_name: librenms_syslogng
    hostname: librenms-syslogng
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - ./env.env
    depends_on:
      - librenms
      - redis
    environment:
      - SIDECAR_SYSLOGNG=1
    ports:
      - "514:514/tcp"
      - "514:514/udp"
    volumes:
      - librenms_data:/data
    restart: unless-stopped

  snmptrapd:
    image: librenms/librenms:latest
    container_name: librenms_snmptrapd
    hostname: librenms-snmptrapd
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - ./env.env
    depends_on:
      - librenms
      - redis
    environment:
      - SIDECAR_SNMPTRAPD=1
    ports:
      - "162:162/tcp"
      - "162:162/udp"
    volumes:
      - librenms_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    platform: linux/arm64
    env_file:
      - ./env.env
    depends_on:
      - alertmanager
      - blackbox_exporter
      - cadvisor
      - node_exporter
      - redis_exporter
      - snmp_exporter
      - ping_exporter
      - process_exporter
      - tailscale_exporter
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    platform: linux/arm64
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    platform: linux/arm64
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    platform: linux/arm64
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    restart: unless-stopped

  blackbox_exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox_exporter
    platform: linux/arm64
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    restart: unless-stopped

  influxdb:
    image: influxdb:2
    container_name: influxdb
    platform: linux/arm64
    env_file:
      - ./env.env
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana
    platform: linux/arm64
    env_file:
      - ./env.env
    depends_on:
      db:
        condition: service_started
      db-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_started
      influxdb:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

  grafana-image-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-image-renderer
    platform: linux/arm64
    environment:
      - ENABLE_METRICS=true
    ports:
      - "8081:8081"
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter
    platform: linux/arm64
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://librenms_redis:6379
    restart: unless-stopped

  snmp_exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp_exporter
    platform: linux/arm64
    ports:
      - "9116:9116"
    volumes:
      - ./snmp/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
    restart: unless-stopped

  ping_exporter:
    image: facelinemark/ping_exporter:latest
    container_name: ping_exporter
    platform: linux/arm64
    ports:
      - "9273:9273"
    volumes:
      - ./ping/ping.yml:/etc/ping_exporter/config.yml:ro
    command:
      - --config.file=/etc/ping_exporter/config.yml
    restart: unless-stopped

  process_exporter:
    image: ncabatoff/process-exporter:latest
    container_name: process_exporter
    platform: linux/arm64
    ports:
      - "9256:9256"
    volumes:
      - /proc:/host/proc:ro
      - ./process/process.yml:/etc/process_exporter/config.yml:ro
    command:
      - --procfs=/host/proc
      - --config.file=/etc/process_exporter/config.yml
    restart: unless-stopped

  speedtest_exporter:
    image: miguelsilva/speedtest_exporter:latest
    container_name: speedtest_exporter
    platform: linux/arm64
    ports:
      - "9430:9430"
    environment:
      - SPEEDTEST_SERVER=0
      - SPEEDTEST_INTERVAL=3600
    restart: unless-stopped

  tailscale_exporter:
    image: mzfr/tailscale-exporter:latest
    container_name: tailscale_exporter
    platform: linux/arm64
    ports:
      - "9184:9184"
    environment:
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY}
      - TAILSCALE_TAILNET=${TAILSCALE_TAILNET}
    volumes:
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    platform: linux/arm64
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    platform: linux/arm64
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    platform: linux/arm64
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped

volumes:
  db_data:
  librenms_data:
  prometheus_data:
  alertmanager_data:
  influxdb_data:
  grafana_data:
  loki_data:
  uptime_kuma_data:
